[workspace]
members = [
    "crates/core",
    "crates/niimctl",
]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
license = "Apache-2.0"
rust-version = "1.95" # MSRV
version = "0.0.1"

[profile.release]
strip = true
lto = true
codegen-units = 1

[workspace.dependencies]
clap = { version = "4.6", features = ["derive", "env", "string"] }
clap_complete = { version = "4.6" }
tokio = { version = "1.54" }
btleplug = { version = "0.13" }
nusb = { version = "0.2" }
futures = { version = "0.3" }

# Our crates
# Not named `core`: that would shadow the standard library's `core` crate.
niim-core = { path = "crates/core" }
