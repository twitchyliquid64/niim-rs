[package]
name = "niim-core"
version.workspace = true
rust-version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["ble", "usb", "label"]
# Bluetooth LE via btleplug (on Linux this pulls in libdbus-sys, the one allowed C dependency).
ble = ["dep:btleplug"]
# USB CDC via nusb (pure Rust).
usb = ["dep:nusb"]
# Label markup, layout and rendering: text, QR codes, barcodes, images (all pure Rust).
label = ["dep:fontdue", "dep:qrcode", "dep:barcoders"]

[dependencies]
tokio = { workspace = true, features = ["sync", "time", "io-util", "rt", "macros"] }
futures.workspace = true
log.workspace = true
thiserror.workspace = true
btleplug = { workspace = true, optional = true }
nusb = { workspace = true, optional = true, features = ["tokio"] }
fontdue = { workspace = true, optional = true }
qrcode = { workspace = true, optional = true }
barcoders = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
